# nginx in front of the MCP server. Replace LONG_RANDOM_SECRET with something like
# `openssl rand -hex 32`, and keep this file out of the server's reach (InaccessiblePaths).
server {
    listen 443 ssl;
    server_name mcp.example.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.com/privkey.pem;

    location /LONG_RANDOM_SECRET/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;            # streamed responses
        proxy_read_timeout 300s;
    }

    location / { return 404; }
}
